name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app/src/**'
      - 'app/App.tsx'
      - 'app/app.json'
      - 'app/package.json'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dépendances
        run: npm ci
      - name: Projet Android natif
        run: npx expo prebuild --platform android --no-install
      - name: Compilation de l'APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk ../annuaire-pro-maroc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: annuaire-pro-maroc-apk
          path: annuaire-pro-maroc.apk
      - name: Publication (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Application Android (dernière version)
          body: Téléchargez annuaire-pro-maroc.apk sur votre téléphone Android, puis ouvrez-le pour l'installer.
          files: annuaire-pro-maroc.apk
          make_latest: true
